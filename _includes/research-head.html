<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% include seo.html %}
<meta name="theme-color" content="#f6f7fb">
<link rel="icon" href="{{ '/images/dudu.png' | relative_url }}" type="image/png">
<link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">
<link rel="preload" href="{{ '/assets/fonts/space-grotesk.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/source-sans-3.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<script>
  (() => {
    let saved;
    try { saved = localStorage.getItem('shengbang-theme'); } catch (_) {}
    const dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.className = dark ? 'dark' : 'light';
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.classList.add('js');
  })();
</script>
<link rel="stylesheet" href="{{ '/assets/css/research.css' | relative_url }}">
